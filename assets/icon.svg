<?xml version="1.0" encoding="UTF-8"?>
<!--
  ibackup icon. A white iPhone with the green "trust" outline it shows when it
  is backing up to a computer, on the blue of an Apple-supported backup screen.
  Rendered at build time by scripts/build-all.sh and embedded into the binary.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a7fe8"/>
      <stop offset="1" stop-color="#1b4bb4"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1a33"/>
      <stop offset="1" stop-color="#0a1329"/>
    </linearGradient>
  </defs>

  <!-- rounded app tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none"
        stroke="#ffffff" stroke-opacity="0.14" stroke-width="6"/>

  <!-- circular sync arrows behind the phone -->
  <g fill="none" stroke="#7ee08a" stroke-width="22" stroke-linecap="round">
    <!-- top-right arc -->
    <path d="M 392 214 A 152 152 0 0 0 256 96"/>
    <!-- bottom-left arc -->
    <path d="M 120 298 A 152 152 0 0 0 256 416"/>
  </g>
  <polygon points="256,66 256,126 208,96" fill="#7ee08a"/>
  <polygon points="256,446 256,386 304,416" fill="#7ee08a"/>

  <!-- iPhone body -->
  <g>
    <rect x="168" y="92" width="176" height="328" rx="30" fill="#ffffff"/>
    <rect x="180" y="104" width="152" height="304" rx="20" fill="url(#screen)"/>
    <!-- notch -->
    <rect x="228" y="104" width="56" height="18" rx="9" fill="#ffffff"/>
    <!-- camera dot -->
    <circle cx="256" cy="113" r="4" fill="#0f1a33"/>
    <!-- home indicator -->
    <rect x="216" y="390" width="80" height="7" rx="3.5" fill="#3c5a7a" opacity="0.85"/>
    <!-- "backing up" glow on the screen -->
    <g fill="#7ee08a" opacity="0.95">
      <rect x="204" y="160" width="104" height="12" rx="6"/>
      <rect x="204" y="188" width="70" height="12" rx="6"/>
      <rect x="204" y="216" width="88" height="12" rx="6"/>
      <rect x="204" y="244" width="52" height="12" rx="6"/>
    </g>
    <!-- checkmark: everything important is copied and safe -->
    <path d="M 222 300 l 24 26 l 46 -54" fill="none" stroke="#7ee08a"
          stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
